[project]
name = "norbix"
version = "1.1.1"
description = "Official Python SDK for Norbix — split API and Hub clients with flat module access."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "UAB Isidos" }]
keywords = ["norbix", "sdk", "python", "api", "hub", "baas"]
dependencies = ["httpx>=0.27.0", "pydantic>=2.0"]

[project.urls]
Homepage = "https://norbix.ai"
Repository = "https://github.com/norbix-code/sdk-python"
Issues = "https://github.com/norbix-code/sdk-python/issues"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "python-semantic-release>=9.15.0",
]

[tool.uv]
# Security floors for packages only the release tool pulls in (python-semantic-release →
# GitPython, requests → urllib3). Locking only, never in the published wheel's metadata.
# Alerts: GHSA-239g-whfq-7xj9, GHSA-g5vv-9gxw-82hx, GHSA-whh4-5q6c-9v3x, GHSA-59cr-6r3x-644w
# (GitPython), GHSA-8988-9cw3-xx77, GHSA-vxq7-64xx-v4gw, GHSA-gh4c-6fx4-qh6g (urllib3).
constraint-dependencies = ["gitpython>=3.1.62", "urllib3>=2.8.0"]

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/norbix_python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "scripts"]
exclude = [".venv", "references"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501", "F401", "I001"]
"src/norbix_python/api/*.py" = ["E501"]
"src/norbix_python/hub/*.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
show_error_codes = true
exclude = ["^docs/"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/norbix_python/__init__.py:__version__"]
branch = "main"
upload_to_pypi = true
build_command = "uv build"
commit_message = "chore(release): {version}"
tag_format = "v{version}"
# Breaking changes release as minor until the public launch (see README "Versioning").
commit_parser = "scripts/release_parser.py:MinorUntilLaunchParser"
major_on_zero = false

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.next]
match = "next"
prerelease = true
prerelease_token = "rc"

[tool.semantic_release.branches.beta]
match = "beta"
prerelease = true
prerelease_token = "beta"
